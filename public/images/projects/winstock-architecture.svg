<svg viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="winstock-arch-title winstock-arch-desc" style="background:#0a0a0c; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;">
  <title id="winstock-arch-title">Winstock Architecture — Offline-First MVVM &amp; Dual-Ledger Sync</title>
  <desc id="winstock-arch-desc">Architectural diagram detailing Winstock's native Android system: Jetpack Compose presentation, reactive MVVM ViewModels, automatic inventory-to-finance sync, and embedded Realm NoSQL persistence.</desc>

  <defs>
    <!-- Background Grid -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1d1d22" stroke-width="0.75" />
    </pattern>

    <!-- Linear Gradients for Apple-inspired subtle dark depth -->
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#8e8e93" />
    </linearGradient>

    <linearGradient id="card-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181c" />
      <stop offset="100%" stop-color="#111114" />
    </linearGradient>

    <linearGradient id="card-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#083344" />
      <stop offset="100%" stop-color="#06202b" />
    </linearGradient>

    <linearGradient id="card-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1a2e" />
      <stop offset="100%" stop-color="#0a121d" />
    </linearGradient>

    <linearGradient id="card-emerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06281e" />
      <stop offset="100%" stop-color="#051a14" />
    </linearGradient>

    <linearGradient id="card-purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#201133" />
      <stop offset="100%" stop-color="#140a22" />
    </linearGradient>

    <linearGradient id="card-amber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24190c" />
      <stop offset="100%" stop-color="#171109" />
    </linearGradient>

    <!-- Arrowheads -->
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0A84FF" />
    </marker>
    <marker id="arrow-emerald" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981" />
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f59e0b" />
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a855f7" />
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6e6e73" />
    </marker>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="750" fill="#0a0a0c" />
  <rect width="1200" height="750" fill="url(#grid-pattern)" opacity="0.6" />

  <!-- Outer Frame -->
  <rect x="20" y="20" width="1160" height="710" rx="16" stroke="#1d1d22" stroke-width="1.5" />

  <!-- HEADER -->
  <g transform="translate(45, 45)">
    <circle cx="8" cy="8" r="4" fill="#0A84FF">
      <animate attributeName="opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite" />
    </circle>
    <text x="24" y="12" fill="url(#header-grad)" font-size="17" font-weight="600" letter-spacing="-0.02em">
      Winstock Architecture — Native Android MVVM &amp; Dual-Ledger Synchronization
    </text>
    <text x="24" y="28" fill="#8e8e93" font-size="11" font-weight="400" letter-spacing="0.01em">
      Jetpack Compose (Material 3) · Unidirectional StateFlow · Realm NoSQL Embedded Database · Auto-Sync Stock-to-Finance Hook
    </text>
  </g>

  <!-- ============================================================== -->
  <!-- LAYER 1: PRESENTATION & DECLARATIVE UI (JETPACK COMPOSE) -->
  <!-- ============================================================== -->
  <g transform="translate(45, 90)">
    <rect width="1110" height="100" rx="12" fill="#111114" stroke="#27272a" stroke-width="1" />
    
    <!-- Layer Label -->
    <rect x="16" y="14" width="85" height="20" rx="4" fill="#18181c" stroke="#3f3f46" stroke-width="0.75" />
    <text x="58" y="28" fill="#d4d4d8" font-size="9" font-weight="600" font-family="monospace" text-anchor="middle">LAYER 1</text>
    <text x="110" y="28" fill="#f4f4f5" font-size="13" font-weight="600" letter-spacing="-0.01em">
      Presentation Layer — Jetpack Compose &amp; Material 3 (Dynamic Color)
    </text>

    <!-- Box 1.1: Stock Screen -->
    <g transform="translate(16, 44)">
      <rect width="250" height="44" rx="8" fill="url(#card-cyan)" stroke="#06b6d4" stroke-width="1" />
      <text x="14" y="19" fill="#67e8f9" font-size="11" font-weight="600">Stock Management Screen</text>
      <text x="14" y="33" fill="#a5f3fc" font-size="9.5">Real-time items list · Search · Low-stock badge</text>
    </g>

    <path d="M 276 66 L 304 66" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#arrow-gray)" />

    <!-- Box 1.2: Expenses Screen -->
    <g transform="translate(314, 44)">
      <rect width="250" height="44" rx="8" fill="url(#card-dark)" stroke="#3f3f46" stroke-width="1" />
      <text x="14" y="19" fill="#f4f4f5" font-size="11" font-weight="600">Expenses &amp; Daily Ledger</text>
      <text x="14" y="33" fill="#8e8e93" font-size="9.5">Recent 24h transactions · Balance card · Fast entry</text>
    </g>

    <path d="M 574 66 L 602 66" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#arrow-gray)" />

    <!-- Box 1.3: Analytics Chart Screen -->
    <g transform="translate(612, 44)">
      <rect width="240" height="44" rx="8" fill="url(#card-dark)" stroke="#3f3f46" stroke-width="1" />
      <text x="14" y="19" fill="#f4f4f5" font-size="11" font-weight="600">Vico Chart Analytics Screen</text>
      <text x="14" y="33" fill="#8e8e93" font-size="9.5">Interactive line charts · Swipe period filter</text>
    </g>

    <path d="M 862 66 L 890 66" stroke="#6e6e73" stroke-width="1.5" marker-end="url(#arrow-gray)" />

    <!-- Box 1.4: Reports & Settings -->
    <g transform="translate(900, 44)">
      <rect width="194" height="44" rx="8" fill="url(#card-dark)" stroke="#3f3f46" stroke-width="1" />
      <text x="14" y="19" fill="#f4f4f5" font-size="11" font-weight="600">Reports &amp; Settings</text>
      <text x="14" y="33" fill="#8e8e93" font-size="9.5">Full audit history · Multi-currency</text>
    </g>
  </g>

  <!-- Connect Layer 1 to Layer 2 -->
  <path d="M 600 190 L 600 205" stroke="#0A84FF" stroke-width="1.5" marker-end="url(#arrow-blue)" />

  <!-- ============================================================== -->
  <!-- LAYER 2: STATE MANAGEMENT & MVVM VIEWMODELS -->
  <!-- ============================================================== -->
  <g transform="translate(45, 208)">
    <rect width="1110" height="105" rx="12" fill="#0d1117" stroke="#0A84FF" stroke-width="1.25" />
    
    <!-- Layer Label -->
    <rect x="16" y="14" width="85" height="20" rx="4" fill="#0c1a2e" stroke="#0A84FF" stroke-width="0.75" />
    <text x="58" y="28" fill="#38bdf8" font-size="9" font-weight="600" font-family="monospace" text-anchor="middle">LAYER 2</text>
    <text x="110" y="28" fill="#f4f4f5" font-size="13" font-weight="600" letter-spacing="-0.01em">
      State Management &amp; Reactive MVVM ViewModels
    </text>
    <text x="895" y="27" fill="#38bdf8" font-size="10" font-weight="500">Unidirectional Data Flow (UDF)</text>

    <!-- Box 2.1: StockViewModel -->
    <g transform="translate(16, 42)">
      <rect width="330" height="51" rx="8" fill="url(#card-dark)" stroke="#3f3f46" stroke-width="1" />
      <text x="14" y="19" fill="#f4f4f5" font-size="11" font-weight="600">StockViewModel</text>
      <text x="14" y="33" fill="#8e8e93" font-size="9.5">StateFlow&lt;List&lt;StockItem&gt;&gt; · Live inventory stream</text>
      <text x="14" y="45" fill="#8e8e93" font-size="9">Handles AddStock, ReduceStock, and LowStock thresholds</text>
    </g>

    <path d="M 356 67 L 384 67" stroke="#0A84FF" stroke-width="1.5" marker-end="url(#arrow-blue)" />

    <!-- Box 2.2: ExpensesViewModel -->
    <g transform="translate(394, 42)">
      <rect width="320" height="51" rx="8" fill="url(#card-dark)" stroke="#3f3f46" stroke-width="1" />
      <text x="14" y="19" fill="#f4f4f5" font-size="11" font-weight="600">ExpensesViewModel &amp; Balance</text>
      <text x="14" y="33" fill="#8e8e93" font-size="9.5">Reactive daily cash flow &amp; BalanceEntry state</text>
      <text x="14" y="45" fill="#8e8e93" font-size="9">Auto-recalculates total saldo &amp; 24h spending aggregations</text>
    </g>

    <path d="M 724 67 L 752 67" stroke="#0A84FF" stroke-width="1.5" marker-end="url(#arrow-blue)" />

    <!-- Box 2.3: AnalyticsViewModel -->
    <g transform="translate(762, 42)">
      <rect width="332" height="51" rx="8" fill="url(#card-dark)" stroke="#3f3f46" stroke-width="1" />
      <text x="14" y="19" fill="#f4f4f5" font-size="11" font-weight="600">AnalyticsViewModel (Vico Pipeline)</text>
      <text x="14" y="33" fill="#8e8e93" font-size="9.5">Transforms transaction history into coordinate charts</text>
      <text x="14" y="45" fill="#8e8e93" font-size="9">Dynamic weekly/monthly/yearly time range aggregation</text>
    </g>
  </g>

  <!-- Connect Layer 2 to Layer 3 -->
  <path d="M 600 313 L 600 328" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-emerald)" />

  <!-- ============================================================== -->
  <!-- LAYER 3: DOMAIN LOGIC & DUAL-LEDGER AUTO-SYNC ENGINE -->
  <!-- ============================================================== -->
  <g transform="translate(45, 331)">
    <rect width="1110" height="110" rx="12" fill="#111114" stroke="#10b981" stroke-width="1.25" stroke-dasharray="6 3" />
    
    <!-- Layer Label -->
    <rect x="16" y="14" width="85" height="20" rx="4" fill="#06281e" stroke="#10b981" stroke-width="0.75" />
    <text x="58" y="28" fill="#34d399" font-size="9" font-weight="600" font-family="monospace" text-anchor="middle">LAYER 3</text>
    <text x="110" y="28" fill="#f4f4f5" font-size="13" font-weight="600" letter-spacing="-0.01em">
      Business Domain Logic — Dual-Ledger Synchronization Engine
    </text>
    <text x="895" y="27" fill="#34d399" font-size="10" font-weight="500">Atomic Cross-Module Bridge</text>

    <!-- Box 3.1: Dual Ledger Auto-Sync Hook (HERO COMPONENT) -->
    <g transform="translate(16, 42)">
      <rect width="450" height="56" rx="8" fill="url(#card-emerald)" stroke="#10b981" stroke-width="1" />
      <text x="14" y="19" fill="#34d399" font-size="11" font-weight="600">Auto-Sync "Record in Financial Report" Hook</text>
      <text x="14" y="34" fill="#a7f3d0" font-size="9.5">• Restock item baru/tambah kuantitas otomatis mengkredit kas</text>
      <text x="14" y="47" fill="#a7f3d0" font-size="9.5">• Menghasilkan entitas Expense kategori inventaris secara atomik</text>
    </g>

    <path d="M 476 70 L 504 70" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-emerald)" />

    <!-- Box 3.2: Low Stock Warning -->
    <g transform="translate(514, 42)">
      <rect width="280" height="56" rx="8" fill="url(#card-amber)" stroke="#d97706" stroke-width="1" />
      <text x="14" y="19" fill="#fbbf24" font-size="11" font-weight="600">Low-Stock Alert Trigger</text>
      <text x="14" y="34" fill="#fde68a" font-size="9.5">• Ambang kuantitas kritis per unit</text>
      <text x="14" y="47" fill="#fde68a" font-size="9.5">• Peringatan visual instan di katalog</text>
    </g>

    <path d="M 804 70 L 832 70" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-emerald)" />

    <!-- Box 3.3: Recurrence & Multi-Currency -->
    <g transform="translate(842, 42)">
      <rect width="252" height="56" rx="8" fill="url(#card-dark)" stroke="#3f3f46" stroke-width="1" />
      <text x="14" y="19" fill="#f4f4f5" font-size="11" font-weight="600">Format &amp; Recurrence Engine</text>
      <text x="14" y="34" fill="#8e8e93" font-size="9.5">• Periodik: Weekly / Monthly / Yearly</text>
      <text x="14" y="47" fill="#8e8e93" font-size="9.5">• Kustom simbol mata uang (IDR/USD)</text>
    </g>
  </g>

  <!-- Connect Layer 3 to Layer 4 -->
  <path d="M 600 441 L 600 456" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-purple)" />

  <!-- ============================================================== -->
  <!-- LAYER 4: LOCAL DATABASE PERSISTENCE (REALM KOTLIN 3.0.0) -->
  <!-- ============================================================== -->
  <g transform="translate(45, 459)">
    <rect width="1110" height="105" rx="12" fill="#111114" stroke="#27272a" stroke-width="1" />
    
    <!-- Layer Label -->
    <rect x="16" y="14" width="85" height="20" rx="4" fill="#18181c" stroke="#3f3f46" stroke-width="0.75" />
    <text x="58" y="28" fill="#d4d4d8" font-size="9" font-weight="600" font-family="monospace" text-anchor="middle">LAYER 4</text>
    <text x="110" y="28" fill="#f4f4f5" font-size="13" font-weight="600" letter-spacing="-0.01em">
      Offline-First Embedded Persistence — Realm Kotlin 3.0.0 (NoSQL Object DB)
    </text>

    <!-- Box 4.1: StockItem Entity -->
    <g transform="translate(16, 42)">
      <rect width="260" height="51" rx="8" fill="url(#card-purple)" stroke="#a855f7" stroke-width="1" />
      <text x="14" y="19" fill="#e9d5ff" font-size="11" font-weight="600">StockItem Schema</text>
      <text x="14" y="33" fill="#c084fc" font-size="9.5">_id (ObjectId) · name · quantity · unit</text>
      <text x="14" y="45" fill="#d8b4fe" font-size="9">price (modal) · lastUpdated (ISO timestamp)</text>
    </g>

    <!-- Box 4.2: Expense Entity -->
    <g transform="translate(290, 42)">
      <rect width="260" height="51" rx="8" fill="url(#card-purple)" stroke="#a855f7" stroke-width="1" />
      <text x="14" y="19" fill="#e9d5ff" font-size="11" font-weight="600">Expense Schema</text>
      <text x="14" y="33" fill="#c084fc" font-size="9.5">_id · amount · category · date · note</text>
      <text x="14" y="45" fill="#d8b4fe" font-size="9">recurrence (None/Weekly/Monthly/Yearly)</text>
    </g>

    <!-- Box 4.3: BalanceEntry Entity -->
    <g transform="translate(564, 42)">
      <rect width="260" height="51" rx="8" fill="url(#card-purple)" stroke="#a855f7" stroke-width="1" />
      <text x="14" y="19" fill="#e9d5ff" font-size="11" font-weight="600">BalanceEntry Schema</text>
      <text x="14" y="33" fill="#c084fc" font-size="9.5">_id · amount · timestamp · source</text>
      <text x="14" y="45" fill="#d8b4fe" font-size="9">Maintains real-time cooperative treasury saldo</text>
    </g>

    <!-- Box 4.4: Category Entity -->
    <g transform="translate(838, 42)">
      <rect width="256" height="51" rx="8" fill="url(#card-purple)" stroke="#a855f7" stroke-width="1" />
      <text x="14" y="19" fill="#e9d5ff" font-size="11" font-weight="600">Category &amp; Preferences</text>
      <text x="14" y="33" fill="#c084fc" font-size="9.5">_id · name · color · icon · predefined</text>
      <text x="14" y="45" fill="#d8b4fe" font-size="9">Stored locally without remote cloud dependency</text>
    </g>
  </g>

  <!-- Connect Layer 4 to Layer 5 -->
  <path d="M 600 564 L 600 579" stroke="#0A84FF" stroke-width="1.5" marker-end="url(#arrow-blue)" />

  <!-- ============================================================== -->
  <!-- LAYER 5: ANDROID RUNTIME & SYSTEM DEPLOYMENT -->
  <!-- ============================================================== -->
  <g transform="translate(45, 582)">
    <rect width="1110" height="88" rx="12" fill="url(#card-blue)" stroke="#0A84FF" stroke-width="1" />
    
    <!-- Layer Label -->
    <rect x="16" y="14" width="85" height="20" rx="4" fill="#0A84FF" stroke="#38bdf8" stroke-width="0.75" />
    <text x="58" y="28" fill="#ffffff" font-size="9" font-weight="700" font-family="monospace" text-anchor="middle">LAYER 5</text>
    <text x="110" y="28" fill="#ffffff" font-size="13" font-weight="600" letter-spacing="-0.01em">
      Android Runtime Environment (ART) &amp; Field Deployment
    </text>

    <!-- Box 5.1: Device Compatibility -->
    <g transform="translate(16, 40)">
      <rect width="330" height="36" rx="6" fill="#111114" stroke="#3f3f46" stroke-width="1" />
      <text x="14" y="15" fill="#f4f4f5" font-size="10.5" font-weight="600">Min SDK 28 (Android 9) → Target SDK 35</text>
      <text x="14" y="27" fill="#8e8e93" font-size="9">Optimized for low-to-mid end Android devices</text>
    </g>

    <!-- Box 5.2: Zero Latency Offline -->
    <g transform="translate(360, 40)">
      <rect width="380" height="36" rx="6" fill="#111114" stroke="#0A84FF" stroke-width="1" />
      <text x="14" y="15" fill="#38bdf8" font-size="10.5" font-weight="600">100% Offline-First Architecture</text>
      <text x="14" y="27" fill="#f4f4f5" font-size="9">Zero latency read/writes · Safe from erratic field connectivity</text>
    </g>

    <!-- Box 5.3: Production Deployment -->
    <g transform="translate(754, 40)">
      <rect width="340" height="36" rx="6" fill="#111114" stroke="#3f3f46" stroke-width="1" />
      <text x="14" y="15" fill="#f4f4f5" font-size="10.5" font-weight="600">Deployed at Koperasi Merah Putih</text>
      <text x="14" y="27" fill="#8e8e93" font-size="9">Kelurahan Wonolopo, Kota Semarang (KKN GIAT 13)</text>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- FOOTER BADGES & METADATA -->
  <!-- ============================================================== -->
  <g transform="translate(45, 688)">
    <!-- Badge 1: Offline-First -->
    <g transform="translate(0, 0)">
      <rect width="215" height="24" rx="12" fill="#111114" stroke="#10b981" stroke-width="0.75" />
      <circle cx="12" cy="12" r="3.5" fill="#10b981" />
      <text x="24" y="16" fill="#f4f4f5" font-size="10" font-weight="500">100% Offline-First (Realm NoSQL)</text>
    </g>

    <!-- Badge 2: Dual-Ledger Sync -->
    <g transform="translate(230, 0)">
      <rect width="210" height="24" rx="12" fill="#111114" stroke="#0A84FF" stroke-width="0.75" />
      <circle cx="12" cy="12" r="3.5" fill="#0A84FF" />
      <text x="24" y="16" fill="#f4f4f5" font-size="10" font-weight="500">Dual-Ledger Sync (Stock ↔ Cash)</text>
    </g>

    <!-- Badge 3: MVVM & StateFlow -->
    <g transform="translate(455, 0)">
      <rect width="215" height="24" rx="12" fill="#111114" stroke="#a855f7" stroke-width="0.75" />
      <circle cx="12" cy="12" r="3.5" fill="#c084fc" />
      <text x="24" y="16" fill="#f4f4f5" font-size="10" font-weight="500">Modern Android MVVM &amp; StateFlow</text>
    </g>

    <!-- Badge 4: Vico & Material 3 -->
    <g transform="translate(685, 0)">
      <rect width="215" height="24" rx="12" fill="#111114" stroke="#06b6d4" stroke-width="0.75" />
      <circle cx="12" cy="12" r="3.5" fill="#22d3ee" />
      <text x="24" y="16" fill="#f4f4f5" font-size="10" font-weight="500">Material 3 UI + Vico Chart Engine</text>
    </g>

    <!-- Community Impact Meta -->
    <text x="1110" y="16" fill="#8e8e93" font-size="10" font-family="monospace" text-anchor="end">
      Community Impact · KKN GIAT 13 UNNES Wonolopo
    </text>
  </g>
</svg>
